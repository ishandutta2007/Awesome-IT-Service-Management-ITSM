<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Glowing Orb Gradients with Animation -->
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Pill Shadow Filter -->
    <filter id="pillShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Title Glow Filter -->
    <filter id="titleGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
    .pulse-line {
      stroke-dasharray: 8 12;
      animation: dashMove 20s linear infinite;
    }
    @keyframes dashMove {
      to {
        stroke-dashoffset: -200;
      }
    }
  </style>

  <!-- 1. Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)"/>

  <!-- 2. Ambient Animated Glow Blobs (Deep Background) -->
  <circle cx="220" cy="130" r="240" fill="url(#glowPurple)">
    <animate attributeName="cx" values="220;260;180;220" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="130;170;100;130" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="280" r="260" fill="url(#glowBlue)">
    <animate attributeName="cx" values="980;940;1020;980" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="280;230;310;280" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="60" r="200" fill="url(#glowCyan)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- 3. Animated Circuit & Process Flow Lines (Midground) -->
  <g opacity="0.45">
    <!-- Flow Line 1: Incident to Resolution -->
    <path d="M 80,70 L 320,70 L 400,110 L 800,110 L 880,70 L 1120,70" fill="none" stroke="#38bdf8" stroke-width="1.5" class="pulse-line"/>
    <!-- Flow Line 2: CMDB to Service Delivery -->
    <path d="M 80,350 L 260,350 L 360,310 L 840,310 L 940,350 L 1120,350" fill="none" stroke="#a78bfa" stroke-width="1.5" class="pulse-line" stroke-dashoffset="50"/>

    <!-- Dynamic Flow Pulse Packets -->
    <circle r="4" fill="#38bdf8">
      <animateMotion path="M 80,70 L 320,70 L 400,110 L 800,110 L 880,70 L 1120,70" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#a78bfa">
      <animateMotion path="M 1120,350 L 940,350 L 840,310 L 360,310 L 260,350 L 80,350" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 4. Dynamic Floating Status Pills (Positioned safely above/below text center) -->
  <!-- Pill 1: Top Left - Incident Management -->
  <g transform="translate(70, 48)">
    <animateTransform attributeName="transform" type="translate" values="70,48; 70,42; 70,48" dur="4s" repeatCount="indefinite"/>
    <rect width="185" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" filter="url(#pillShadow)"/>
    <circle cx="20" cy="17" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="35" y="22" fill="#e2e8f0" class="pill-label">🚨 Incident Response</text>
  </g>

  <!-- Pill 2: Top Right - ITIL v4 Aligned -->
  <g transform="translate(945, 48)">
    <animateTransform attributeName="transform" type="translate" values="945,48; 945,54; 945,48" dur="5s" repeatCount="indefinite"/>
    <rect width="185" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#a78bfa" stroke-width="1.2" filter="url(#pillShadow)"/>
    <circle cx="20" cy="17" r="5" fill="#a78bfa">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="35" y="22" fill="#e2e8f0" class="pill-label">📐 ITIL v4 Workflows</text>
  </g>

  <!-- Pill 3: Bottom Left - CMDB & Assets -->
  <g transform="translate(70, 335)">
    <animateTransform attributeName="transform" type="translate" values="70,335; 70,341; 70,335" dur="4.5s" repeatCount="indefinite"/>
    <rect width="185" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#34d399" stroke-width="1.2" filter="url(#pillShadow)"/>
    <circle cx="20" cy="17" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="35" y="22" fill="#e2e8f0" class="pill-label">📦 CMDB &amp; IT Assets</text>
  </g>

  <!-- Pill 4: Bottom Right - SLA & AIOps -->
  <g transform="translate(945, 335)">
    <animateTransform attributeName="transform" type="translate" values="945,335; 945,329; 945,335" dur="4.2s" repeatCount="indefinite"/>
    <rect width="185" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.2" filter="url(#pillShadow)"/>
    <circle cx="20" cy="17" r="5" fill="#f59e0b">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="35" y="22" fill="#e2e8f0" class="pill-label">⚡ 99.9% SLA &amp; AIOps</text>
  </g>

  <!-- 5. Foreground Core Content (Statically Placed in Front for Guaranteed Readability) -->
  <!-- Center Backdrop Plate -->
  <rect x="230" y="105" width="740" height="210" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Category Tag Badge -->
  <g transform="translate(470, 125)">
    <rect width="260" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="130" y="18" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      ENTERPRISE &amp; OPEN-SOURCE ECOSYSTEM
    </text>
  </g>

  <!-- Primary Headline -->
  <text x="600" y="198" fill="url(#titleGrad)" font-size="40" text-anchor="middle" class="title-text" filter="url(#titleGlow)">
    Awesome IT Service Management
  </text>
  <text x="600" y="235" fill="#94a3b8" font-size="21" font-weight="600" text-anchor="middle" class="title-text">
    (ITSM &amp; ITIL Tools Directory)
  </text>

  <!-- Subtitle -->
  <text x="600" y="274" fill="#cbd5e1" font-size="15" text-anchor="middle" class="subtitle-text">
    Curated SaaS Platforms, Self-Hosted Stacks, CMDB Solutions &amp; Incident Automation
  </text>

  <!-- Live Pulse Status Indicator -->
  <g transform="translate(500, 296)">
    <circle cx="10" cy="6" r="4" fill="#10b981">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="10" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      Updated for 2026 • Curated with Community Contributions
    </text>
  </g>

  <!-- Border Accent Outline -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4"/>
</svg>
